name: Test FD Behavior

on:
  workflow_dispatch:

jobs:
  test-fd:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        architecture: ['x86', 'x64']

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          allow-prereleases: true

      - name: Install dependencies
        run: pip install soundfile numpy typing_extensions cffi

      - name: Write test script
        run: |
          $script = @'
          import os
          import sys
          import numpy as np
          import soundfile as sf

          arch = "x64" if sys.maxsize > 2**32 else "x86"
          print("Python  : " + sys.version)
          print("Arch    : " + arch)
          print("---")

          sf.write("test.wav", np.zeros((1000, 2)), 44100)

          fd = os.open("test.wav", os.O_RDONLY)
          f = sf.SoundFile(fd)
          f.close()

          try:
              os.lseek(fd, 0, os.SEEK_SET)
              print("RESULT: FAIL — fd is STILL OPEN (soundfile did NOT close it)")
          except OSError as exc:
              print("RESULT: PASS — fd is CLOSED correctly, errno=" + str(exc.errno))
          '@
          $script | Out-File -FilePath test_fd.py -Encoding utf8

      - name: Run test
        run: python test_fd.py